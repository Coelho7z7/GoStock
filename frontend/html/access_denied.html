<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoStock - Acesso negado</title>
    <link rel="stylesheet" href="/css/base.css?v=7">
</head>
<body class="access-denied-page">
    <main class="access-denied-content">
        <section class="access-denied-card" role="alert" aria-live="assertive">
            <span class="access-denied-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
            </span>
            <div>
                <span class="access-denied-kicker">Permissão necessária</span>
                <h1>Ação bloqueada</h1>
                <p>Apenas administradores podem alterar informações no GoStock.</p>
                <button type="button" onclick="history.back()">Voltar</button>
            </div>
        </section>
    </main>
</body>
</html>
