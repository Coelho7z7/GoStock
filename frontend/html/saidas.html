<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GoStock - Saídas</title>

    <link rel="stylesheet" href="/css/estoque.css">
</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">

            <h1 class="logo">
                Go<span>Stock</span>
            </h1>

            <nav>
                <a href="/dashboard">Dashboard</a>
                <a href="/produtos">Produtos</a>
                <a href="/saidas">Saídas</a>
                <a href="/movimentacoes">Movimentações</a>
            </nav>

        </aside>

        <main class="main-content">

            <header class="topbar">
                <h2>Saídas</h2>
            </header>

            <section class="content">

                <h3>Registrar saída de estoque</h3>

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Produto</th>
                            <th>Estoque atual</th>
                            <th>Quantidade</th>
                            <th>Ação</th>
                        </tr>
                    </thead>

                    <tbody>

                        {{ range .Produtos }}

                        <tr>

                            <td>{{ .ID }}</td>

                            <td>{{ .Nome }}</td>

                            <td>
                                <span class="estoque-quantidade {{ .StatusEstoque }}">
                                    {{ .Quantidade }}
                                </span>
                            </td>

                            <td>

                                <form action="/estoque/saida" method="POST">

                                    <input
                                        type="hidden"
                                        name="produto_id"
                                        value="{{ .ID }}"
                                    >

                                    <input
                                        type="number"
                                        name="quantidade"
                                        min="1"
                                        max="{{ .Quantidade }}"
                                        placeholder="Quantidade"
                                        required
                                    >

                            </td>

                            <td>

                                    <button type="submit">
                                        Registrar saída
                                    </button>

                                </form>

                            </td>

                        </tr>

                        {{ else }}

                        <tr>
                            <td colspan="5">
                                Nenhum produto cadastrado.
                            </td>
                        </tr>

                        {{ end }}

                    </tbody>

                </table>

            </section>

        </main>

    </div>

</body>
</html>
