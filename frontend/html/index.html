<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GoStock - Login</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

        <main class="login-page">

        <div class="login-hero">
            <svg class="hero-chart" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
                <polyline points="0,220 90,180 180,200 270,110 360,140 450,50 500,70" fill="none" stroke="#2563eb"
                    stroke-width="2" opacity="0.35" />
                <polyline points="0,220 90,180 180,200 270,110 360,140 450,50 500,70 500,300 0,300"
                    fill="url(#chartFade)" stroke="none" opacity="0.5" />
                <defs>
                    <linearGradient id="chartFade" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#2563eb" stop-opacity="0.2" />
                        <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
                    </linearGradient>
                </defs>
            </svg>

            <div class="login-logo">
                <img class="login-logo-image" src="/images/Go-Logo_Blue.png"
                    alt="Go">
                GoStock
            </div>

            <h1>Controle seu estoque com clareza.</h1>
            <p>Sistema de gestão de estoque com PDV, movimentações e relatórios.</p>

            <div class="login-badges">
                <div class="badge"><strong>PDV</strong><span>integrado</span></div>
                <div class="badge"><strong>SQLite</strong><span>local</span></div>
                <div class="badge"><strong>Go</strong><span>backend</span></div>
            </div>
        </div>

        <div class="login-form-side">
            <section class="login-card">

                <h2 class="welcome-title">Bem-vindo</h2>

                <p class="subtitle">
                    Entre para acessar o painel de gestão
                </p>

                <form action="/login" method="POST">

                    <div class="input-group">
                        <label for="email">E-mail</label>

                        <input type="email" id="email" name="email" value="{{ .Email }}"
                            placeholder="Digite seu e-mail" required>
                    </div>

                    <div class="input-group">
                        <label for="senha">Senha</label>

                        <div class="campo-senha">
                            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                            <button type="button" class="olho" id="mostrarSenha" aria-label="Mostrar senha">
                                <svg id="iconeOlho" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit">
                        Entrar
                    </button>

                </form>

                <p class="footer-text">
                    GoStock © 2026
                </p>

            </section>
        </div>

    </main>

    {{ if .Erro }}
    <div class="login-alert" role="alert" aria-live="assertive">
        <span class="login-alert-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        </span>
        <span>
            <strong>Não foi possível entrar</strong>
            <small>{{ .Erro }}</small>
        </span>
    </div>
    {{ end }}

    <script src="/js/app.js"></script>

</body>

</html>
